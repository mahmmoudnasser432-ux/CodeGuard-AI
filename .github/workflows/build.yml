name: Build Verification

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build All Workspaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Build All Workspaces
        env:
          NEXT_PUBLIC_BACKEND_API_URL: https://api.codeguard.ai
          NODE_ENV: production
        run: npm run build
