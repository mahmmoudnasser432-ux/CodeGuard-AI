name: Test Suite

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test-ai-service:
    name: Test AI Service (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./apps/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        working-directory: ./apps/ai-service
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock-key-for-unit-tests' }}
          GEMINI_MODEL: gemini-3.6-flash
        run: |
          python -m pytest

  test-api:
    name: Test Backend API (Express)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run API Tests
        working-directory: ./apps/api
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-32-bytes-long-12345
          JWT_REFRESH_SECRET: test-refresh-secret-32-bytes-long-12345
        run: npx vitest run tests/analyses.api.test.ts tests/health.test.ts
