name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions: deployment jobs only need read access to repository contents
permissions:
  contents: read

jobs:
  deploy-ai-service:
    name: Deploy AI Service to Railway
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout Code
        # Pinned to immutable commit SHA for supply-chain security (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to Railway (AI Service)
        # Evaluates job-level env to safely skip if deployment credentials are not configured
        if: ${{ env.RAILWAY_TOKEN != '' }}
        # Pinned to immutable commit SHA (bervProject/railway-deploy v0.1.2)
        uses: bervProject/railway-deploy@8d82d4b6ebb4a7428580ef148281ee876ecfd2a9 # v0.1.2
        with:
          service: "codeguard-ai-service"

  deploy-api:
    name: Deploy Backend API to Railway
    runs-on: ubuntu-latest
    needs: [deploy-ai-service]
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout Code
        # Pinned to immutable commit SHA for supply-chain security (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to Railway (API)
        # Evaluates job-level env to safely skip if deployment credentials are not configured
        if: ${{ env.RAILWAY_TOKEN != '' }}
        # Pinned to immutable commit SHA (bervProject/railway-deploy v0.1.2)
        uses: bervProject/railway-deploy@8d82d4b6ebb4a7428580ef148281ee876ecfd2a9 # v0.1.2
        with:
          service: "codeguard-api"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [deploy-api]
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        # Pinned to immutable commit SHA for supply-chain security (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to Vercel
        # Evaluates job-level env to safely skip if deployment credentials are not configured
        if: ${{ env.VERCEL_TOKEN != '' }}
        # Pinned to immutable commit SHA (amondnet/vercel-action v42.3.0)
        uses: amondnet/vercel-action@de09aea714cbef6a72e8169996b794d075ff57b8 # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./apps/web
