version: '3.8'

services:
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: codeguard-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_TIMEOUT_SECONDS=30.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codeguard-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_URL=http://localhost:5000
      - AI_SERVICE_URL=http://ai-service:8000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-production-jwt-access-secret-32bytes}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-production-jwt-refresh-secret-32bytes}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      ai-service:
        condition: service_healthy

networks:
  default:
    name: codeguard-network
