services:
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: codeguard-ai-service
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PORT=8000
      - AI_PROVIDER=${AI_PROVIDER:-nvidia}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-meta/llama-3.2-11b-vision-instruct}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-30.0}
      - REDIS_URL=${REDIS_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codeguard-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_URL=${API_URL}
      - API_BASE_URL=${API_BASE_URL:-${API_URL}}
      - AI_SERVICE_URL=http://ai-service:8000
      - SQLSERVER_HOST=${SQLSERVER_HOST}
      - SQLSERVER_PORT=${SQLSERVER_PORT:-1433}
      - SQLSERVER_DATABASE=${SQLSERVER_DATABASE:-CodeGuardAI}
      - SQLSERVER_USER=${SQLSERVER_USER}
      - SQLSERVER_PASSWORD=${SQLSERVER_PASSWORD}
      - SQLSERVER_ENCRYPT=true
      - SQLSERVER_TRUST_SERVER_CERTIFICATE=false
      - SQLSERVER_CONNECTION_TIMEOUT=${SQLSERVER_CONNECTION_TIMEOUT:-15000}
      - SQLSERVER_REQUEST_TIMEOUT=${SQLSERVER_REQUEST_TIMEOUT:-30000}
      - SQLSERVER_POOL_MIN=${SQLSERVER_POOL_MIN:-2}
      - SQLSERVER_POOL_MAX=${SQLSERVER_POOL_MAX:-20}
      - SQLSERVER_POOL_IDLE_TIMEOUT=${SQLSERVER_POOL_IDLE_TIMEOUT:-30000}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGIN=${CORS_ORIGIN:-${FRONTEND_URL}}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-CodeGuard AI}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_TLS=${EMAIL_TLS:-true}
      - REDIS_URL=${REDIS_URL}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-120}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      ai-service:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_API_URL=${NEXT_PUBLIC_BACKEND_API_URL}
    container_name: codeguard-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_BACKEND_API_URL=${NEXT_PUBLIC_BACKEND_API_URL}
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: codeguard-prod-network
